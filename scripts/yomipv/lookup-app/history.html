<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Yomipv History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div id="history-container">
    <div id="history-header">
      <span id="header-title">HISTORY</span>
      <div class="header-buttons">
        <button id="time-toggle">SUB START</button>
        <button id="anim-toggle">GIF: OFF</button>
        <button id="clear-history">CLEAR</button>
        <button id="open-settings">⚙</button>
      </div>
    </div>
    <div id="history-scroll-clip">
      <div id="history-list">
      </div>
    </div>
    <div class="fade-mask top-fade"></div>
    <div class="fade-mask bottom-fade"></div>
  </div>
  <script src="history.js"></script>
</body>
</html>
